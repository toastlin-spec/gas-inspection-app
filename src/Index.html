<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>加油站巡檢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* 版面：手機寬度單欄（最寬 480px）— 登入卡片；登入後為固定頂部列、捲動內容、底部分頁列 */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunken:#f6f8f7; --ink:#16201b; --muted:#5b6862; --line:#d5ddd9;
  --accent:#1c7a4b; --accent-ink:#ffffff; --accent-soft:#dff0e6;
  --bad:#c0352d; --bad-soft:#fbe8e6; --warn:#a86500; --warn-soft:#fbefd9; --na:#6f7b75; --na-soft:#e7ecea;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#16201b; --sunken:#121a16; --ink:#e3ebe7; --muted:#93a29a; --line:#29352f;
  --accent:#4cc38a; --accent-ink:#06130c; --accent-soft:#173326;
  --bad:#ff7d70; --bad-soft:#3a1a17; --warn:#f0b24a; --warn-soft:#33260d; --na:#9aa7a0; --na-soft:#24302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#16201b; --sunken:#121a16; --ink:#e3ebe7; --muted:#93a29a; --line:#29352f;
  --accent:#4cc38a; --accent-ink:#06130c; --accent-soft:#173326;
  --bad:#ff7d70; --bad-soft:#3a1a17; --warn:#f0b24a; --warn-soft:#33260d; --na:#9aa7a0; --na-soft:#24302a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.app.nologin{padding-bottom:24px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.demo{margin:0;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.top-row{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.04em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* login */
.login{margin-top:max(24px,6vh);display:flex;flex-direction:column;gap:16px}
.login .mark{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.login .mark svg{width:28px;height:28px}
.pw{font-family:var(--font-mono);font-size:22px;letter-spacing:.3em;text-align:center}
.who{display:flex;flex-direction:column;gap:8px}
.who button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:12px 14px;min-height:52px}
.who button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pwhint{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12px}

.todo{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.todo .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.todo.done .ic{background:var(--na-soft);color:var(--na)}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block}
.todo .tx span{font-size:13px;color:var(--muted)}
.stat{padding:14px 16px}
.stat b{font-size:28px;line-height:1.1;display:block}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.mini{padding:10px 12px;border-radius:10px;background:var(--sunken);border:1px solid var(--line)}
.mini b{font-family:var(--font-mono);font-size:22px;display:block;line-height:1.2}
.mini span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}

.light{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.grp-title{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:10px 0 2px;font-weight:700}
.grp-title:first-child{margin-top:0}
.grp-title+.light{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.g{background:var(--accent)} .dot.y{background:var(--warn)} .dot.r{background:var(--bad)}

.tabs{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.cat{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:4px 2px -4px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.item.bad{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.item.err{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.item-head{display:flex;gap:10px;align-items:flex-start}
.code{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.item p{margin:0;flex:1;min-width:0}
.law{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--sunken);border-radius:10px;font-weight:500}
.seg button[aria-pressed="true"].ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].ng{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--na);border-color:var(--na);color:var(--surface)}
.pts{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.risk{font-size:11px;border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.risk.高{background:var(--bad-soft);color:var(--bad)} .risk.中{background:var(--warn-soft);color:var(--warn)} .risk.低{background:var(--na-soft);color:var(--na)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:72px;resize:vertical}
.photo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo label.btn{display:inline-flex;align-items:center;gap:6px}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.ph{width:72px;height:72px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);background:var(--sunken);text-align:center;padding:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.dock{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:0 6px 20px rgba(10,30,20,.12);display:flex;flex-direction:column;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--na-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-family:var(--font-mono);font-size:34px;line-height:1}
.counts{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.counts b{font-family:var(--font-mono);color:var(--ink)}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary b{flex:1}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
details.sec .body{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunken);border-radius:0 0 var(--r) var(--r)}
.chev{transition:transform .2s;color:var(--muted)}
details.sec[open] .chev{transform:rotate(90deg)}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.issue{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.issue.over{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.issue .t{font-weight:700;min-width:0}
.issue .m{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:500;white-space:nowrap;align-self:start}
.st.待處理{background:var(--bad-soft);color:var(--bad)} .st.改善中{background:var(--warn-soft);color:var(--warn)}
.st.待驗證{background:var(--accent-soft);color:var(--accent)} .st.已結案{background:var(--na-soft);color:var(--na)}
.over-tag{color:var(--bad);font-weight:700}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(5,15,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:flex-start;gap:10px}
.sheet-head h1{flex:1;font-size:18px}
.iconbtn{border:0;background:var(--na-soft);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 0 14px 20px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline li::after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .who{color:var(--muted)}

.xls{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.xls table{border-collapse:collapse;font-size:12px;min-width:100%}
.xls th,.xls td{border:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap;vertical-align:top}
.xls th{background:var(--accent-soft);color:var(--ink);font-weight:700}
.xls td.wrap{white-space:normal;min-width:180px}
.xls .meta td{background:var(--sunken);font-weight:500}
.file{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.file .xl{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px;font-weight:600;flex:none}
.file div{min-width:0}
.file b{display:block;word-break:break-all;font-size:14px}

.list-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .sub{font-size:12px;color:var(--muted);grid-column:1}
.list-row>div{min-width:0}
.switch{position:relative;width:44px;height:26px;border-radius:13px;border:0;background:var(--na-soft);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.off{opacity:.5}

.done-card{text-align:center;padding:28px 16px}
.done-card .big{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.msg{font-size:13px;color:var(--bad);margin:0}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabbar .in{max-width:480px;margin:0 auto;display:flex}
nav.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);text-decoration:none;position:relative}
nav.tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;font-family:var(--font-mono)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
.rowbtn{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.list-row .rowbtn .sub{font-size:12px;color:var(--muted)}
.btn.sm{white-space:nowrap;flex:none}
.list-row div .sub{display:block}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--sunken);min-height:44px}
</style>
<script>
/* 啟動監看：主程式 8 秒內沒有啟動時，在畫面上顯示可能原因（與主程式分開，主程式有語法錯誤時仍會執行） */
window.__appVersion='1.1.0';window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push((e.message||'錯誤')+(e.lineno?'（第 '+e.lineno+' 行）':''))});
setTimeout(function(){
  if(window.__appStarted)return;
  var v=document.getElementById('view');if(!v)return;
  v.innerHTML='<div class="panel stack" style="margin-top:24px"><b>畫面沒有正常啟動</b>'+
  '<span class="small">請系統管理員依序確認：</span>'+
  '<ol class="small" style="margin:0;padding-left:20px;line-height:1.8">'+
  '<li>Apps Script 的 Index.html 有完整貼上，最後一行是 &lt;/html&gt;</li>'+
  '<li>修改程式後，已從「部署 → 管理部署作業 → 編輯 → 版本：新版本」重新部署</li>'+
  '<li>瀏覽器沒有封鎖 script.google.com 的指令碼</li></ol>'+
  (window.__errs.length?'<span class="small" style="color:var(--bad)">錯誤訊息：'+window.__errs.slice(0,3).join('；').split(String.fromCharCode(60)).join('&lt;')+'</span>':'<span class="small muted">沒有收到錯誤訊息。</span>')+
  '<span class="small muted">畫面版本 '+(window.__appVersion||'1.1.0')+'</span><button class="btn block" onclick="location.reload()">重新載入</button></div>';
},8000);
</script>
</head>
<body>
<div class="app" id="app">
  <div class="busy" id="busy" hidden></div>
  <header class="top" id="topbar" hidden>
    <div class="top-row">
      <div class="brand"><b>加油站巡檢</b><span id="ctx"></span></div>
      <button class="btn sm ghost" data-act="logout">登出</button>
    </div>
  </header>
  <main id="view"><p class="muted" style="text-align:center;margin-top:30vh">載入中…</p></main>
</div>
<nav class="tabbar" id="tabnav" aria-label="主選單" hidden><div class="in" id="tabbar"></div></nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
const ICON={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 check:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
 audit:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
 issues:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 manage:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
 chev:'<path d="m9 18 6-6-6-6"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>', ok:'<path d="M20 6 9 17l-5-5"/>',
 edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- 與後端溝通 ---------- */
function api(fn,...args){return new Promise((res,rej)=>{
 if(!(window.google&&google.script&&google.script.run)){rej(new Error('請從系統管理員提供的網址開啟'));return}
 const timer=setTimeout(()=>rej(new Error('伺服器沒有回應，請確認網路後重新整理')),45000);
 google.script.run.withSuccessHandler(v=>{clearTimeout(timer);res(v)}).withFailureHandler(e=>{clearTimeout(timer);rej(e)})[fn](...args)})}
async function call(fn,...args){
 setBusy(1);
 try{return await api(fn,...args)}
 catch(e){const m=String(e&&e.message||e);
  if(m.indexOf('SESSION_EXPIRED')>=0){toastT('登入已逾時，請重新登入');resetAll();render()}
  else toastT(stripErr(m));
  throw e}
 finally{setBusy(-1)}}
function setBusy(d){S.busy=Math.max(0,S.busy+d);document.getElementById('busy').hidden=!S.busy;document.querySelectorAll('[data-busy]').forEach(b=>b.disabled=!!S.busy)}
function toastT(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,3000)}
function resetAll(){S.token=null;S.sess=null;S.home=null;S.issues=null;S.admin=null;S.problems=null;S.sheet=null;
 S.login={step:1,role:null,pw:'',stations:[],officers:[],station:'',name:'',officer:'',err:''};
 S.check={freq:'每日',ans:{},note:{},photo:{},tried:false,result:null};store.del('gi_token');store.del('gi_sess')}
async function loadHome(){S.home=await call('getHome',S.token);S.sess=S.home.session;return S.home}

const route=()=>{let r=(location.hash||'').slice(1);if(!S.sess||!TABS[r]||!TABS[r].roles.includes(S.sess.role))r='home';return r};
const go=r=>{if(location.hash==='#'+r)onRoute();else location.hash=r};
async function onRoute(){
 if(!S.sess){render();return}
 const r=route();S.sheet=null;
 if(r!=='check')S.check.result=null;
 if(r!=='audit')S.audit.result=null;
 try{
  if(r==='audit'){S.auditForm=await call('getAuditForm',S.token);if(!S.audit.result){pickAuditStation();loadAuditDraft()}}
  if(r==='home')await loadHome();
  if(r==='check'){if(!S.home)await loadHome();if(!S.check.result)loadDraft();}
  if(r==='issues')S.issues=await call('listIssues',S.token);
  if(r==='manage')S.admin=await call('adminData',S.token);
 }catch(e){}
 render();window.scrollTo({top:0});
}

function groupBy(arr,f){const m=new Map();arr.forEach(x=>{const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return m}
function stationOptions(list,sel){return REGIONS.map(r=>{const g=list.filter(s=>s.region===r);return g.length?`<optgroup label="${r}">${g.map(s=>`<option value="${esc(s.code)}" ${s.code===sel?'selected':''}>${esc(s.group)}・${esc(s.name)}</option>`).join('')}</optgroup>`:''}).join('')}
const mgrName=s=>String(s||'').split('（兼）').join('').split('(兼)').join('').trim();
function freshAudit(){return{station:'',ans:{},other:{},note:{},photo:{},tried:false,result:null,openCats:null}}
const auditKey=()=>S.auditForm&&S.audit.station?`gi_audit_${S.audit.station}_${S.auditForm.today}`:'';
function saveAuditDraft(){const k=auditKey();if(k)draft.set(k,{ans:S.audit.ans,other:S.audit.other,note:S.audit.note})}
function loadAuditDraft(){const F=S.auditForm,a=S.audit;if(!F)return;const k=auditKey(),d=k&&draft.get(k);
 const def={};F.items.forEach(i=>{if(i.other)def[i.code]='na'});
 a.ans=d&&d.ans||def;a.other=d&&d.other||{};a.note=d&&d.note||{};a.photo={};a.tried=false;a.openCats=null}
function pickAuditStation(){const F=S.auditForm,a=S.audit;if(!F||!F.stations.length)return;
 if(a.station&&F.stations.some(s=>s.code===a.station))return;
 const next=F.stations.find(s=>!s.auditedThisQuarter)||F.stations[0];a.station=next.code}
function auditCalc(){const F=S.auditForm,a=S.audit;let pass=0,total=0,na=0,ok=0,ng=0,nac=0,todo=0;
 F.items.forEach(i=>{const v=a.ans[i.code],pt=Number(i.pts)||0;total+=pt;if(v==='ok'){pass+=pt;ok++}else if(v==='na'){na+=pt;nac++}else if(v==='ng')ng++;else todo++});
 const base=total-na;return{pass,total,na,base,ok,ng,nac,todo,score:base>0?Math.round(pass/base*1000)/10:null}}
function downloadBase64(name,b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i!==bin.length;i++)u[i]=bin.charCodeAt(i);
 const url=URL.createObjectURL(new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
 const el=document.createElement('a');el.href=url;el.download=name;document.body.appendChild(el);el.click();setTimeout(()=>{URL.revokeObjectURL(url);el.remove()},1500);toastT('已下載 '+name)}
const fmtScore=v=>v===null||v===undefined||v===''?'—':Number(v).toFixed(1);
const draftKey=()=>S.home&&S.sess?`gi_draft_${S.sess.station}_${S.check.freq}_${S.home.today}`:'';
function saveDraft(){const k=draftKey();if(k)draft.set(k,{ans:S.check.ans,note:S.check.note})}
function loadDraft(){const k=draftKey(),d=k&&draft.get(k);S.check.ans=d&&d.ans||{};S.check.note=d&&d.note||{};S.check.photo={};S.check.tried=false;S.check.result=null}

/* ---------- 照片壓縮：長邊 1280 像素、JPEG ---------- */
function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const max=1280,k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.72))};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('無法讀取這張照片，請重新拍攝'))};img.src=url})}

 if(A==='aans'){const a=S.audit;a.ans[d.code]=a.ans[d.code]===d.v?undefined:d.v;if(a.ans[d.code]!=='ng')delete a.photo[d.code];

  if(d.v==='ng'&&a.ans[d.code]==='ng'){const t=document.getElementById('an-'+d.code);t&&t.focus({preventScroll:true})}return}
 if(A==='rmAPhoto'){delete S.audit.photo[d.code];const y=window.scrollY;S.audit.openCats=[...document.querySelectorAll('details.sec[open]')].map(x=>x.dataset.cat);render();window.scrollTo({top:y});return}
 if(A==='submitAudit'){
  const F=S.auditForm,a=S.audit;
  const bad=F.items.filter(i=>!a.ans[i.code]||(i.other&&a.ans[i.code]!=='na'&&!(a.other[i.code]||'').trim()));
  if(bad.length){a.tried=true;a.openCats=[bad[0].cat];render();const t=document.getElementById('it-'+bad[0].code);t&&t.scrollIntoView({block:'center',behavior:'smooth'});toastT(`還有 ${bad.length} 項需要完成`);return}
  const answers=F.items.map(i=>({code:i.code,result:a.ans[i.code],note:a.ans[i.code]==='ng'?(a.note[i.code]||''):'',other:i.other?(a.other[i.code]||''):'',photo:a.ans[i.code]==='ng'?(a.photo[i.code]||''):''}));
  const R=await call('submitAudit',S.token,{station:a.station,answers});
  draft.del(auditKey());a.result=Object.assign(R,{confirmedBy:''});render();window.scrollTo({top:0});return}
 if(A==='newAudit'){const prev=S.audit.result&&S.audit.result.station.code;S.audit=freshAudit();S.auditForm=await call('getAuditForm',S.token);
  const next=S.auditForm.stations.find(x=>!x.auditedThisQuarter&&x.code!==prev)||S.auditForm.stations[0];S.audit.station=next?next.code:'';loadAuditDraft();render();window.scrollTo({top:0});return}
 if(A==='exportAudit'){const r=await call('exportAudit',S.token,d.id);downloadBase64(r.filename,r.data);return}
 if(A==='ifilter'){S.issueFilter=d.f;render();return}
 if(A==='openIssue'){S.sheet={type:'issue',key:d.id};render();return}
 if(A==='closeSheet'){S.sheet=null;render();return}
 if(A==='mtab'){S.manageTab=d.t;render();return}
 if(A==='streg'){S.stRegion=d.r;render();return}
 if(A==='iform'){S.itemForm=d.t;render();return}
 if(A==='editStation'){S.sheet={type:'station',key:d.code};render();return}
 if(A==='editOfficer'){S.sheet={type:'officer',key:d.name};render();return}
 if(A==='editItem'){S.sheet={type:'item',key:d.code};render();return}
 if(A==='tog'){await call('adminToggle',S.token,d.kind,d.key);S.admin=await call('adminData',S.token);render();return}
 if(A==='checkData'){S.problems=await call('adminCheckData',S.token);render();return}
 }catch(err){render()}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.note){S.check.note[t.dataset.note]=t.value;saveDraft()}
 if(t.id==='lgName')S.login.name=t.value;
 if(t.dataset.aother){S.audit.other[t.dataset.aother]=t.value;saveAuditDraft()}
 if(t.dataset.anote){S.audit.note[t.dataset.anote]=t.value;saveAuditDraft()}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='lgSt'){S.login.station=t.value;const s=S.login.stations.find(x=>x.code===t.value);S.login.name=mgrName(s&&s.mgr);render();return}
 if(t.id==='auditSt'){saveAuditDraft();S.audit.station=t.value;loadAuditDraft();render();return}
 const f=t.files&&t.files[0];
 if(f&&t.dataset.aphoto){try{setBusy(1);S.audit.photo[t.dataset.aphoto]=await compress(f)}catch(err){toastT(err.message)}finally{setBusy(-1)}
  const y=window.scrollY;S.audit.openCats=[...document.querySelectorAll('details.sec[open]')].map(x=>x.dataset.cat);render();window.scrollTo({top:y});return}
 if(f&&t.dataset.photo){try{setBusy(1);S.check.photo[t.dataset.photo]=await compress(f)}catch(err){toastT(err.message)}finally{setBusy(-1)}render()}
});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target.dataset.form,v=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
 try{
 if(f==='pw'){const pw=v('pw');if(!pw){S.login.err='請輸入密碼';render();return}
  const r=await call('checkPassword',pw);
  if(!r.ok){S.login.err=r.message;render();return}
  S.login=Object.assign(S.login,{step:2,role:r.role,pw,err:'',stations:r.stations||[],officers:r.officers||[]});
  if(r.role==='站長'){const s=S.login.stations[0];S.login.station=s?s.code:'';S.login.name=mgrName(s&&s.mgr)}
  if(r.role==='安保專員'&&S.login.officers.length===1)S.login.officer=S.login.officers[0].name;
  if(r.role==='系統管理員'){await doLogin({pw});return}
  render();return}
 if(f==='mgr'){const name=v('lgName');if(!name){S.login.err='請輸入填報人姓名';render();return}await doLogin({pw:S.login.pw,station:v('lgSt'),name});return}
 if(f==='confirm'){const r=await call('confirmAudit',S.token,S.audit.result.recordId,v('cfName'));S.audit.result.confirmedBy=r.confirmedBy;toastT('站長已確認查核結果');render();return}
 if(f==='station'){await call('adminSaveStation',S.token,{code:v('fsCode'),region:v('fsRegion'),group:v('fsGroup'),name:v('fsName'),mgr:v('fsMgr'),email:v('fsEmail')});toastT('已儲存站點');S.sheet=null;S.admin=await call('adminData',S.token);render();return}
 if(f==='officer'){const regions=[...document.querySelectorAll('input[name=foReg]:checked')].map(x=>x.value).join('、');
  await call('adminSaveOfficer',S.token,{originalName:v('foOrig'),name:v('foName'),regions,email:v('foEmail')});toastT('已儲存安保專員');S.sheet=null;S.admin=await call('adminData',S.token);render();return}
 if(f==='item'){const code=await call('adminSaveItem',S.token,{code:v('fiCode'),freq:v('fiFreq'),risk:v('fiRisk'),cat:v('fiCat'),text:v('fiText'),std:v('fiStd'),law:v('fiLaw')});toastT('已儲存 '+code);S.sheet=null;S.admin=await call('adminData',S.token);render();return}
 }catch(err){if(S.sess)render();else{S.login.err=stripErr(err&&err.message||err);render()}}
});
async function doLogin(req){
 const r=await call('login',req);
 S.token=r.token;S.sess=r.session;store.set('gi_token',r.token);store.set('gi_sess',r.session);
 S.login.pw='';
 if(location.hash&&location.hash!=='#home')history.replaceState(null,'',location.pathname+location.search+'#home');
 await onRoute();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
window.addEventListener('hashchange',onRoute);
(async function boot(){
 window.__appStarted=true;
 const t=store.get('gi_token'),s=store.get('gi_sess');
 if(t&&s){S.token=t;S.sess=s;document.getElementById('view').innerHTML='<p class="muted" style="text-align:center;margin-top:30vh">正在恢復登入…</p>';try{await loadHome()}catch(e){resetAll()}}
 if(S.sess)await onRoute();else render();
})();
</script>

</body>
</html>
