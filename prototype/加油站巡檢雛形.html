<title>加油站巡檢 App 雛形</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column (max 480px) — sticky station header, scrolling view, fixed bottom tab bar */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunken:#f6f8f7; --ink:#16201b; --muted:#5b6862; --line:#d5ddd9;
  --accent:#1c7a4b; --accent-ink:#ffffff; --accent-soft:#dff0e6;
  --bad:#c0352d; --bad-soft:#fbe8e6; --warn:#a86500; --warn-soft:#fbefd9; --na:#6f7b75; --na-soft:#e7ecea;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#16201b; --sunken:#121a16; --ink:#e3ebe7; --muted:#93a29a; --line:#29352f;
  --accent:#4cc38a; --accent-ink:#06130c; --accent-soft:#173326;
  --bad:#ff7d70; --bad-soft:#3a1a17; --warn:#f0b24a; --warn-soft:#33260d; --na:#9aa7a0; --na-soft:#24302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#16201b; --sunken:#121a16; --ink:#e3ebe7; --muted:#93a29a; --line:#29352f;
  --accent:#4cc38a; --accent-ink:#06130c; --accent-soft:#173326;
  --bad:#ff7d70; --bad-soft:#3a1a17; --warn:#f0b24a; --warn-soft:#33260d; --na:#9aa7a0; --na-soft:#24302a; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.demo{margin-top:12px;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.top-row{max-width:480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:16px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roles{max-width:480px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.roles::-webkit-scrollbar{display:none}
.roles small{font-size:11px;color:var(--muted);align-self:center;white-space:nowrap;letter-spacing:.06em}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.04em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.todo{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.todo .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.todo.done .ic{background:var(--na-soft);color:var(--na)}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block}
.todo .tx span{font-size:13px;color:var(--muted)}
.stat{padding:14px 16px}
.stat b{font-size:28px;line-height:1.1;display:block}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--bad)}

.light{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.light:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%}
.dot.g{background:var(--accent)} .dot.y{background:var(--warn)} .dot.r{background:var(--bad)}

.tabs{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.cat{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:4px 2px -4px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.item.bad{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.item.err{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.item-head{display:flex;gap:10px;align-items:flex-start}
.code{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--sunken);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.item p{margin:0;flex:1;min-width:0}
.law{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border:1px solid var(--line);background:var(--sunken);border-radius:10px;font-weight:500}
.seg button[aria-pressed="true"].ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].ng{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--na);border-color:var(--na);color:var(--surface)}
.pts{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.risk{font-size:11px;border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.risk.高{background:var(--bad-soft);color:var(--bad)} .risk.中{background:var(--warn-soft);color:var(--warn)} .risk.低{background:var(--na-soft);color:var(--na)}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
input[type=text],input[type=email],select,textarea{width:100%;border:1px solid var(--line);background:var(--sunken);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:72px;resize:vertical}
.photo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.photo label.btn{display:inline-flex;align-items:center;gap:6px}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.ph{width:72px;height:72px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);background:var(--sunken);text-align:center;padding:4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.dock{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:0 6px 20px rgba(10,30,20,.12);display:flex;flex-direction:column;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--na-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.score{display:flex;align-items:baseline;gap:6px}
.score b{font-family:var(--font-mono);font-size:34px;line-height:1}
.counts{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.counts b{font-family:var(--font-mono);color:var(--ink)}

details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary b{flex:1}
details.sec[open]>summary{border-bottom:1px solid var(--line)}
details.sec .body{padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunken);border-radius:0 0 var(--r) var(--r)}
.chev{transition:transform .2s;color:var(--muted)}
details.sec[open] .chev{transform:rotate(90deg)}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.issue{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.issue.over{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.issue .t{font-weight:700;min-width:0}
.issue .m{grid-column:1/-1;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st{font-size:12px;border-radius:999px;padding:2px 10px;font-weight:500;white-space:nowrap;align-self:start}
.st.待處理{background:var(--bad-soft);color:var(--bad)} .st.改善中{background:var(--warn-soft);color:var(--warn)}
.st.待驗證{background:var(--accent-soft);color:var(--accent)} .st.已結案{background:var(--na-soft);color:var(--na)}
.over-tag{color:var(--bad);font-weight:700}

.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(5,15,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:flex-start;gap:10px}
.sheet-head h1{flex:1;font-size:18px}
.iconbtn{border:0;background:var(--na-soft);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 0 14px 20px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline li::after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .who{color:var(--muted)}

.list-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .sub{font-size:12px;color:var(--muted);grid-column:1}
.list-row>div{min-width:0}
.switch{position:relative;width:44px;height:26px;border-radius:13px;border:0;background:var(--na-soft);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.off{opacity:.5}

.done-card{text-align:center;padding:28px 16px}
.done-card .big{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.msg{font-size:13px;color:var(--bad)}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabbar .in{max-width:480px;margin:0 auto;display:flex}
nav.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;color:var(--muted);text-decoration:none;position:relative}
nav.tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;font-family:var(--font-mono)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand"><b>加油站巡檢</b><span id="ctx"></span></div>
      <select id="stationSel" aria-label="切換站點" style="width:auto;min-height:36px;padding:6px 10px;font-size:13px"></select>
    </div>
    <div class="roles" role="group" aria-label="示範角色" id="roles"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar" aria-label="主選單"><div class="in" id="tabbar"></div></nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
const ICON={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 check:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
 audit:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
 issues:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 manage:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
 camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
 chev:'<path d="m9 18 6-6-6-6"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>', ok:'<path d="M20 6 9 17l-5-5"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const md=d=>`${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;
const RISK_DAYS={高:1,中:3,低:7};

/* ---------- 範例資料 ---------- */
const S={
 role:'站務人員', station:'ST001',
 stations:[
  {code:'ST001',name:'和美站',region:'中區',on:true,daily:'none',audit:{date:'08/14',score:94.8}},
  {code:'ST002',name:'鹿港站',region:'中區',on:true,daily:'done',audit:{date:'09/03',score:97.9}},
  {code:'ST003',name:'員林站',region:'中區',on:true,daily:'part',audit:{date:'07/22',score:88.5}},
  {code:'ST004',name:'大肚站',region:'中區',on:true,daily:'done',audit:{date:'09/18',score:100}},
  {code:'ST005',name:'斗六站',region:'南區',on:true,daily:'none',audit:{date:'08/27',score:91.7}},
  {code:'ST006',name:'新營站',region:'南區',on:true,daily:'done',audit:{date:'09/09',score:95.8}}],
 users:[
  {email:'staff01@example.com',name:'王小明',role:'站務人員',station:'ST001',on:true},
  {email:'mgr01@example.com',name:'陳志豪',role:'站長',station:'ST001',on:true},
  {email:'safety01@example.com',name:'林安保',role:'安保專員',station:'中區',on:true},
  {email:'admin01@example.com',name:'職安衛管理員',role:'系統管理員',station:'全部',on:true}],
 items:[
  ['SC-D01','每日','環境','地面無油漬、無積水、吸油棉與砂箱存量足夠','職業安全衛生設施規則','中'],
  ['SC-D02','每日','環境','其它危害','職業安全衛生設施規則','低'],
  ['SC-W01','每週','環境','油水分離槽無溢流','水污染防治法','中'],
  ['SC-M01','每月','消防','滅火器在定位、壓力指針在綠區、無遮擋、無逾期','消防法、各類場所消防安全設備設置標準','高'],
  ['SC-M02','每月','消防','滅火器外觀、有效期限、壓力逐支點檢','消防安全設備檢修及申報辦法','高'],
  ['SC-M03','每月','加油設備','加油機無漏油、油槍及軟管無破損、緊急遮斷閥、內部有無積水、防爆管線及防爆接線盒良好','加油站設置管理規則','高'],
  ['SC-M04','每月','油槽','油槽人孔及卸油口蓋妥上鎖、周邊無油漬，壓力錶顯示狀態、陰井是否有漏油、氣或積水','公共危險物品及可燃性高壓氣體設置標準暨安全管理辦法','高'],
  ['SC-M05','每月','環境','「嚴禁煙火」「加油請熄火」「不強迫加油」標示清楚，進出口標誌、標線清楚良好','加油站設置管理規則','中'],
  ['SC-M06','每月','電氣','配電箱關閉、無異常聲響或焦味','職業安全衛生設施規則','中'],
  ['SC-M07','每月','電氣','漏電斷路器按測試鈕可跳脫、接地線完整','職業安全衛生設施規則','高'],
  ['SC-M08','每月','緊急應變','急救箱藥品齊全且未過期','職業安全衛生設施規則','低'],

     <div class="photo">${c.photo[i.code]?`<img class="thumb" src="${c.photo[i.code]}" alt="異常照片">`:''}<label class="btn" for="p-${i.code}">${ic('camera','s')}${c.photo[i.code]?'重拍':'拍照'}</label><input type="file" accept="image/*" capture="environment" id="p-${i.code}" data-photo="${i.code}"><span class="small muted">${i.risk==='高'?'高風險：送出後立即通知':'改善期限 '+RISK_DAYS[i.risk]+' 天'}</span></div>
     ${err?'<p class="msg">請填寫異常說明</p>':''}`:''}

 return html;

/* ---------- SL-H015 查核 ---------- */
function auditScore(){
 const items=itemsFor('SL-H015'); let pass=0,na=0,ng=0,todo=0,cntOk=0,cntNa=0;
 items.forEach(i=>{const a=S.audit.ans[i.code];if(a==='ok'){pass+=i.pts;cntOk++}else if(a==='na'){na+=i.pts;cntNa++}else if(a==='ng')ng++;else todo++});
 const total=items.reduce((s,i)=>s+i.pts,0), base=total-na;
 return {pass,na,base,total,ng,todo,cntOk,cntNa,score:base>0?Math.round(pass/base*1000)/10:null,n:items.length};
}
function vAudit(){
 const a=S.audit, sc=auditScore();
 if(a.submitted){
  return `<div class="panel done-card"><div class="big">${ic('audit')}</div><h1>${esc(stName(a.submitted.station))} 查核完成</h1>

   ${a.confirmed?`<p class="small" style="color:var(--accent)">${ic('ok','s')} 站長已於 ${md(TODAY)} 確認查核結果</p>`:`<div class="panel" style="background:var(--warn-soft);border-color:var(--warn);text-align:left;margin-top:12px"><b>等待站長確認</b><p class="small" style="margin:4px 0 10px">站長在自己的手機按「確認查核結果」後，取代紙本簽名。這裡先模擬站長確認。</p><button class="btn block" data-act="mgrConfirm">模擬：站長確認查核結果</button></div>`}

 }
 const g=groupBy(itemsFor('SL-H015'),'cat');
 let html=`<div class="row between"><h1>SL-H015 季查核</h1><span class="code">0601 版</span></div>
 <div class="field"><label for="auditStation">受查站點</label><select id="auditStation">${S.stations.filter(s=>s.on&&s.region==='中區').map(s=>`<option value="${s.code}" ${s.code===S.station?'selected':''}>${esc(s.name)}（${s.code}）</option>`).join('')}</select></div>`;
 let first=true;
 for(const [cat,arr] of g){
  const done=arr.filter(i=>a.ans[i.code]).length, ngc=arr.filter(i=>a.ans[i.code]==='ng').length, pts=arr.reduce((s,i)=>s+i.pts,0);
  html+=`<details class="sec" ${first?'open':''} data-cat="${esc(cat)}"><summary><b>${esc(cat)}</b>${ngc?`<span class="risk 高">${ngc} 不符合</span>`:''}<span class="pts">${done}/${arr.length}・${pts}分</span>${ic('chev','s chev')}</summary><div class="body">`;
  first=false;
  for(const i of arr){
   const v=a.ans[i.code], err=a.tried&&!v;
   html+=`<div class="item ${v==='ng'?'bad':''} ${err?'err':''}" id="it-${i.code}"><div class="item-head"><span class="code">${i.code.replace('H015-','')}</span><p>${esc(i.text)}</p><span class="pts">${i.pts} 分</span></div>
    ${i.other?`<div class="field"><label for="o-${i.code}">其他項目內容（未使用時維持不適用）</label><input type="text" id="o-${i.code}" data-other="${i.code}" value="${esc(a.other[i.code]||'')}" placeholder="查核人自行填寫"></div>`:''}
    <div class="seg" role="group" aria-label="${esc(i.text)}">
     <button class="ok" aria-pressed="${v==='ok'}" data-act="aans" data-code="${i.code}" data-v="ok">符合</button>
     <button class="ng" aria-pressed="${v==='ng'}" data-act="aans" data-code="${i.code}" data-v="ng">不符合</button>
     <button class="na" aria-pressed="${v==='na'}" data-act="aans" data-code="${i.code}" data-v="na">不適用</button></div>
    ${v==='ng'?`<div class="small muted">風險等級 <span class="risk ${i.risk}">${i.risk}</span>・改善期限 ${RISK_DAYS[i.risk]} 天</div>`:''}
    ${i.law?`<div class="law">${esc(i.law)}</div>`:''}</div>`;
  }
  html+=`</div></details>`;
 }
 html+=`<div class="dock"><div class="row between"><div class="score"><b>${sc.score==null?'—':sc.score.toFixed(1)}</b><span class="muted small">分</span></div>
  <div class="counts"><span>符合 <b>${sc.cntOk}</b></span><span>不符合 <b style="color:var(--bad)">${sc.ng}</b></span><span>不適用 <b>${sc.cntNa}</b></span><span>未填 <b>${sc.todo}</b></span></div></div>
  <div class="small muted mono">符合 ${sc.pass} ÷ 基準 ${sc.base}（${sc.total} − 不適用 ${sc.na}）× 100</div>
  <button class="btn primary block" data-act="submitAudit">完成查核</button></div>`;
 return html;
}

function render(){
 const r=route();
 document.getElementById('roles').innerHTML=`<small>示範角色</small>`+ROLES.map(x=>`<button class="chip" aria-pressed="${S.role===x}" data-act="role" data-r="${x}">${x}</button>`).join('');
 const sel=document.getElementById('stationSel');
 sel.innerHTML=S.stations.filter(s=>s.on).map(s=>`<option value="${s.code}" ${s.code===S.station?'selected':''}>${esc(s.name)}</option>`).join('');
 sel.hidden=!['站務人員','站長'].includes(S.role);
 const u=S.users.find(x=>x.role===S.role);
 document.getElementById('ctx').textContent=`${u?u.name:''}・${S.role}`;
 const open=S.issues.filter(i=>i.status!=='已結案'&&(S.role==='安保專員'?i.status==='待驗證':i.station===S.station)).length;
 document.getElementById('tabbar').innerHTML=Object.entries(TABS).filter(([k,t])=>t.roles.includes(S.role)).map(([k,t])=>`<a href="#${k}" ${k===r?'aria-current="page"':''}>${ic(t.icon)}${t.label}${k==='issues'&&open?`<span class="badge">${open}</span>`:''}</a>`).join('');
 const V={home:vHome,check:vCheck,audit:vAudit,issues:vIssues,manage:vManage};
 document.getElementById('view').innerHTML=V[r]();
 const sh=document.getElementById('sheet');
 const iss=S.sheet&&S.issues.find(i=>i.id===S.sheet);
 sh.innerHTML=iss?`<div class="sheet-wrap" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="異常詳情">${vIssueSheet(iss)}</div></div>`:'';
}

/* ---------- 互動 ---------- */
function newIssue(o){const id='ISS-'+String(++seq).padStart(4,'0');S.issues.unshift(Object.assign({id,created:new Date(TODAY),due:addDays(TODAY,RISK_DAYS[o.risk]),status:'待處理'},o));return id}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el)return;
 if(el.classList.contains('sheet-wrap')&&e.target!==el)return;
 const d=el.dataset, A=d.act;
 if(A==='role'){S.role=d.r;S.sheet=null;if(!TABS[route()].roles.includes(S.role))go('home');else render();return}
 if(A==='startCheck'){S.check={freq:d.freq,ans:{},note:{},photo:{},submitted:null,tried:false};go('check');return}
 if(A==='freq'){S.check.freq=d.freq;S.check.tried=false;render();return}
 if(A==='ans'){S.check.ans[d.code]=S.check.ans[d.code]===d.v?undefined:d.v;render();if(d.v==='ng'){const t=document.getElementById('n-'+d.code);t&&t.focus({preventScroll:true})}return}
 if(A==='submitCheck'){
  const c=S.check,list=itemsFor('自主檢查',c.freq);
  const bad=list.filter(i=>!c.ans[i.code]||(c.ans[i.code]==='ng'&&!(c.note[i.code]||'').trim()));
  if(bad.length){c.tried=true;render();const t=document.getElementById('it-'+bad[0].code);t&&t.scrollIntoView({block:'center',behavior:'smooth'});toastT(`還有 ${bad.length} 項需要完成`);return}
  const ng=list.filter(i=>c.ans[i.code]==='ng');
  ng.forEach(i=>newIssue({station:S.station,src:'自主檢查',code:i.code,title:c.note[i.code].trim(),risk:i.risk,log:[{t:new Date(TODAY),who:'王小明（站務人員）',text:`${c.freq}檢查通報異常${c.photo[i.code]?'，附照片 1 張':''}`}]}));
  c.submitted={freq:c.freq,total:list.length,abn:ng.length,high:ng.some(i=>i.risk==='高')};
  if(c.freq==='每日'){const s=S.stations.find(x=>x.code===S.station);if(s)s.daily='done'}
  render();window.scrollTo({top:0});return}
 if(A==='resetCheck'){S.check={freq:S.check.freq,ans:{},note:{},photo:{},submitted:null,tried:false};render();return}
 if(A==='aans'){S.audit.ans[d.code]=S.audit.ans[d.code]===d.v?undefined:d.v;const open=[...document.querySelectorAll('details.sec[open]')].map(x=>x.dataset.cat);const y=window.scrollY;render();document.querySelectorAll('details.sec').forEach(x=>x.open=open.includes(x.dataset.cat));window.scrollTo({top:y});return}
 if(A==='submitAudit'){
  const sc=auditScore();
  if(sc.todo){S.audit.tried=true;render();const first=itemsFor('SL-H015').find(i=>!S.audit.ans[i.code]);const det=document.getElementById('it-'+first.code).closest('details');document.querySelectorAll('details.sec').forEach(x=>x.open=x===det);document.getElementById('it-'+first.code).scrollIntoView({block:'center',behavior:'smooth'});toastT(`還有 ${sc.todo} 項未填`);return}
  const st=document.getElementById('auditStation').value;
  itemsFor('SL-H015').filter(i=>S.audit.ans[i.code]==='ng').forEach(i=>newIssue({station:st,src:'SL-H015',code:i.code,title:i.other&&S.audit.other[i.code]?S.audit.other[i.code]:i.text.slice(0,40)+(i.text.length>40?'…':''),risk:i.risk,log:[{t:new Date(TODAY),who:'林安保（安保專員）',text:'季查核不符合'}]}));
  S.audit.submitted=Object.assign({station:st},sc);S.audit.confirmed=false;
  const s=S.stations.find(x=>x.code===st);if(s&&sc.score!=null)s.audit={date:md(TODAY),score:sc.score};
  render();window.scrollTo({top:0});return}
 if(A==='mgrConfirm'){S.audit.confirmed=true;render();toastT('站長已確認查核結果');return}
 if(A==='resetAudit'){S.audit={ans:{},other:{},submitted:null,confirmed:false,tried:false};S.items.filter(i=>i.form==='SL-H015'&&i.other).forEach(i=>S.audit.ans[i.code]='na');render();return}
 if(A==='ifilter'){S.issueFilter=d.f;render();return}
 if(A==='openIssue'){S.sheet=d.id;S.fixPhoto=null;render();return}
 if(A==='closeSheet'){S.sheet=null;render();return}
 const iss=d.id&&S.issues.find(i=>i.id===d.id);
 if(A==='istart'){iss.status='改善中';iss.log.push({t:new Date(TODAY),who:'陳志豪（站長）',text:'開始改善'});render();toastT('已改為改善中');return}
 if(A==='ireport'){const n=document.getElementById('fixNote').value.trim();if(!n){document.getElementById('fixMsg').hidden=false;return}
  iss.status='待驗證';iss.log.push({t:new Date(TODAY),who:'陳志豪（站長）',text:n+(S.fixPhoto?'，附改善後照片':'')});render();toastT('已回報，等待安保專員驗證');return}
 if(A==='irejectAsk'){document.getElementById('rejectBox').hidden=false;document.getElementById('rejNote').focus();return}
 if(A==='ireject'){const n=document.getElementById('rejNote').value.trim();if(!n){document.getElementById('rejMsg').hidden=false;return}
  iss.status='改善中';iss.log.push({t:new Date(TODAY),who:'林安保（安保專員）',text:'退回：'+n});render();toastT('已退回站長');return}
 if(A==='iclose'){iss.status='已結案';iss.closed=new Date(TODAY);iss.log.push({t:new Date(TODAY),who:'林安保（安保專員）',text:'驗證合格，結案'});render();toastT('已結案');return}
 if(A==='mtab'){S.manageTab=d.t;render();return}
 if(A==='iform'){S.itemForm=d.t;render();return}
 if(A==='tog'){const o=S[d.list][+d.k];o.on=!o.on;render();return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.note)S.check.note[t.dataset.note]=t.value;
 if(t.dataset.other)S.audit.other[t.dataset.other]=t.value;
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='stationSel'){S.station=t.value;S.sheet=null;render();return}
 const f=t.files&&t.files[0];
 if(f&&(t.dataset.photo||t.dataset.fixphoto)){const r=new FileReader();r.onload=()=>{if(t.dataset.photo)S.check.photo[t.dataset.photo]=r.result;else S.fixPhoto=r.result;
   const keep=document.getElementById('fixNote')?.value;render();if(keep!=null){const n=document.getElementById('fixNote');if(n)n.value=keep}};r.readAsDataURL(f)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.dataset.form,v=id=>document.getElementById(id).value.trim();
 if(f==='station'){const code=v('fsCode').toUpperCase();if(S.stations.some(s=>s.code===code)){toastT('站點代碼已存在');return}
  S.stations.push({code,name:v('fsName'),region:v('fsRegion'),on:true,daily:'none',audit:{date:'—',score:0}});toastT('已新增站點 '+v('fsName'))}
 if(f==='user'){S.users.push({email:v('fuEmail'),name:v('fuName'),role:v('fuRole'),station:v('fuSt'),on:true});toastT('已新增人員 '+v('fuName'))}
 if(f==='item'){const freq=v('fiFreq'),p={每日:'D',每週:'W',每月:'M'}[freq];
  const n=S.items.filter(i=>i.code.startsWith('SC-'+p)).length+1;const code=`SC-${p}${String(n).padStart(2,'0')}`;
  S.items.push({code,form:'自主檢查',freq,cat:v('fiCat'),text:v('fiText'),law:v('fiLaw')||'公司規定',risk:v('fiRisk'),pts:null,on:true});toastT(`已新增 ${code}`)}
 render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render()}});
window.addEventListener('hashchange',()=>{S.sheet=null;render();window.scrollTo({top:0})});
render();
</script>
